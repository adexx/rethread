name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASS: root
      APP_ENV: local
      APP_URL: http://127.0.0.1:8000
      MAIL_DRIVER: log

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, curl, mbstring, openssl
          coverage: none
          ini-values: display_errors=On, error_reporting=E_ALL

      - name: Syntax check
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install database and demo data
        run: php install.php

      - name: Start PHP server
        run: |
          php -S 127.0.0.1:8000 scripts/dev-router.php > /tmp/php-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8000/ > /dev/null && break; sleep 0.5; done

      - name: Run tests
        run: php tests/run.php --http

      - name: Server log
        if: failure()
        run: cat /tmp/php-server.log
