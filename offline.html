<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16191c">
<title>Offline · Rethread</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #16191c; color: #eef0f2;
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 72px; height: 72px; margin: 0 auto 16px; display: block; }
  p { color: #9aa3ab; max-width: 320px; margin: 8px auto 20px; }
  button { background: #f2a65a; color: #1b1309; border: 0; border-radius: 10px; padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <img src="assets/icons/icon-192.png" alt="">
    <h1 style="font-size:22px;margin:0">You're offline</h1>
    <p>Check your connection and try again. Your favorites and messages will be here when you're back.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
