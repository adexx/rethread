# Local development: docker compose up -d, then docker compose exec app php install.php
# The site runs at http://localhost:8080 with the demo data. Not for production.
services:
  app:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8080
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: rethread
      DB_USER: root
      DB_PASS: root
      MAIL_DRIVER: log
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # reach it from your machine on port 3307 (avoids clashing with a local MySQL)
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
